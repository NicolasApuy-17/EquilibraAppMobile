plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
   id "com.google.gms.google-services"  // Google Services plugin
   id "com.google.firebase.crashlytics"  // Crashlytics plugin

}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "pe.com.equilibra.app"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId "pe.com.equilibra.app"
        // firebase-auth 23.x requires minSdk 23; flutter.minSdkVersion
        // (21) is too low and fails the manifest merge.
        minSdkVersion 23
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

   signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }

    buildTypes {
        release {
            // Production artifacts must use the configured publishing identity.
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def googleConfig = new groovy.json.JsonSlurper().parse(file('google-services.json'))
    if (googleConfig.project_info.project_id != 'equilibra-w5rl2h' ||
        !googleConfig.client.any { it.client_info.android_client_info.package_name == 'pe.com.equilibra.app' }) {
        throw new GradleException('Descarga google-services.json de la app pe.com.equilibra.app registrada en el proyecto existente equilibra-w5rl2h. No reutilices la configuración de otro package.')
    }
    if (graph.allTasks.any { it.project == project && it.name.endsWith('Release') }) {
        def requiredKeys = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword']
        if (requiredKeys.any { !keystoreProperties[it] }) {
            throw new GradleException('Para compilar release, configura android/key.properties con la clave de publicación. Debug no requiere esta configuración.')
        }
        def signingStore = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
        rootProject.file(keystoreProperties['storeFile']).withInputStream { input ->
            signingStore.load(input, keystoreProperties['storePassword'].toCharArray())
        }
        def signingCertificate = signingStore.getCertificate(keystoreProperties['keyAlias'])
        if (signingCertificate == null ||
            signingCertificate.subjectX500Principal.name.toLowerCase().contains('cn=android debug')) {
            throw new GradleException('Release requiere un certificado de carga de producción; Android Debug no está permitido.')
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
}
